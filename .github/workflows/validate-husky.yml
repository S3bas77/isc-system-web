name: Validate Husky Marker

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commits for husky marker
        run: |
          echo "🔍 Revisando commits entre ${{ github.event.before }} y ${{ github.sha }}"

          # obtener commits del rango
          COMMITS=$(git log ${{ github.event.before }}..${{ github.sha }} --pretty=format:"%h")

          if [ -z "$COMMITS" ]; then
            echo "No hay commits para revisar."
            exit 0
          fi

          echo "Commits encontrados: $COMMITS"
          echo ""

          MISSING=0
          for c in $COMMITS; do
            MSG=$(git log -1 --pretty=%B $c)
            echo "Revisando commit $c"
            echo "$MSG"
            echo "---"
            if ! echo "$MSG" | grep -q "\[husky-verified:"; then
              echo "::error ::Commit $c no contiene el marcador [husky-verified:...]"
              MISSING=1
            else
              echo "Commit $c tiene el marcador"
            fi
            echo ""
          done

          if [ $MISSING -ne 0 ]; then
            echo "Se detectaron commits sin el marcador husky."
            exit 1
          fi

          echo "Todos los commits contienen el marcador husky."
