name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar commits
        run: |
          echo "Checking commits..."
          COMMITS=$(git log --pretty=%B -n 10)
          echo "$COMMITS"

          if ! echo "$COMMITS" | grep -q "\[husky-verified:"; then
            echo "Error: commit sin marcador de husky"
            exit 1
          fi

          echo "Todos los commits tienen marcador"
